<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — RubricOps</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-logo">Rubric<span>Ops</span></div>
    <p class="text-muted mb-2" style="font-size:13px">K12 Cybersecurity Rubric Evaluations</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autofocus
               placeholder="you@district.edu">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
               placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary w-full" style="justify-content:center;margin-top:.5rem">
        Sign in
      </button>
    </form>

    <p class="text-sm text-muted mt-2" style="text-align:center">
      Contact your district administrator to reset your password.
    </p>
  </div>
</div>
</body>
</html>
