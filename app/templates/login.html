<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — RubricOps</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-logo">Rubric<span>Ops</span></div>
    <p class="text-muted mb-2" style="font-size:13px">K12 Cybersecurity Rubric Evaluations</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    {% if sso %}
    <a href="{{ url_for('auth.auth_start') }}" class="btn btn-primary w-full"
       style="justify-content:center;margin-top:.5rem;display:flex;align-items:center;gap:.5rem;text-decoration:none">
      <svg width="18" height="18" viewBox="0 0 21 21" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
        <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
      </svg>
      Sign in with Microsoft 365
    </a>
    {% else %}
    <div class="alert alert-warn">Development login — SSO is not configured.</div>
    <form method="post" action="{{ url_for('auth.dev_login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <button class="btn btn-primary w-full" type="submit" style="justify-content:center">Sign in</button>
    </form>
    {% endif %}

    <p class="text-sm text-muted mt-2" style="text-align:center">
      Contact your district administrator if you cannot access your account.
    </p>
  </div>
</div>
</body>
</html>
